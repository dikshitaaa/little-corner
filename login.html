<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome Back ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/login.css">
</head>

<body>

  <div class="floating-particles" id="particles"></div>

  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-envelope">💌</div>

      <div class="tiny-stars">✦ ˚ ✧</div>

      <h1 class="title">welcome back ♡</h1>

      <p class="subtitle">
        your little corner is waiting for you…
      </p>

      <form id="login-form">

        <div class="field-group">
          <label for="email">your email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">your password</label>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="primary-btn">
          ♡ sign in
        </button>

      </form>

      <p class="switch-text">
        don't have an account?
        <a href="/signup.html">create one ♡</a>
      </p>

      <p id="login-message" class="message"></p>

    </div>

  </main>

  <script type="module" src="/login.js"></script>

</body>
</html>
